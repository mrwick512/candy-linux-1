# TLP overrides for the Celeron N2830/N2840 (Bay Trail-M) in the candy.
# Defaults are kept wherever the stock value is already right.

# Intel 7260 Wi-Fi: let the radio sleep between packets on battery.
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Runtime power management for PCI(e) and USB devices on battery.
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=default
USB_AUTOSUSPEND=1

# Don't restore radio state from the last session: a Chromebook has no
# hardware radio switch, and a stale "off" state is confusing.
RESTORE_DEVICE_STATE_ON_STARTUP=0
