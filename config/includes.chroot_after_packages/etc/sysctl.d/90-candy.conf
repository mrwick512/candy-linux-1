# Tuning for 2-4 GB RAM and a 16 GB eMMC.

# Swap lives on compressed RAM (zram), so swapping is cheap: prefer it over
# dropping page cache, and don't read-ahead from a RAM-backed device.
vm.swappiness = 100
vm.page-cluster = 0
vm.vfs_cache_pressure = 50

# Write dirty pages back less often: fewer eMMC writes, less wear, less wakeup.
vm.dirty_writeback_centisecs = 1500

# The NMI watchdog costs power for no benefit on a laptop.
kernel.nmi_watchdog = 0
