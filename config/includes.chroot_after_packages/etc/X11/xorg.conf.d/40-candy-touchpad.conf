# The candy has a single-surface ClickPad (no separate buttons).
# These are libinput settings; change them here or in XFCE's Mouse and Touchpad settings.
Section "InputClass"
	Identifier "Candy touchpad"
	MatchIsTouchpad "on"
	MatchDriver "libinput"
	Option "Tapping" "on"
	Option "TappingButtonMap" "lrm"
	Option "DisableWhileTyping" "on"
	# Two-finger click = right click, three-finger click = middle click.
	Option "ClickMethod" "clickfinger"
	# ChromeOS scrolled "naturally"; set to "on" to keep that behaviour.
	Option "NaturalScrolling" "off"
EndSection
